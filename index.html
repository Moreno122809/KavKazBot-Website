<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KavKaz Bot – Status</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
        }

        header {
            background: #171a23;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #2b3040;
        }

        header h1 {
            margin: 0 0 15px;
        }

        nav a {
            color: #bbb;
            text-decoration: none;
            margin: 0 12px;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
        }

        .hero h2 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #aaa;
        }

        section {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: #171a23;
            border: 1px solid #2b3040;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .status {
            font-size: 24px;
            font-weight: bold;
        }

        .online,
        .active {
            color: #4ade80;
        }

        .maintenance {
            color: #facc15;
        }

        .offline {
            color: #f87171;
        }

        .command-card {
            background: #171a23;
            border: 1px solid #2b3040;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .command-name {
            font-size: 20px;
            font-weight: bold;
            color: #8b9cff;
            margin-bottom: 8px;
        }

        .command-description {
            color: #bbb;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #1f8f4d;
        }

        .badge.inactive {
            background: #8f2f2f;
        }

        .badge.development {
            background: #b8860b;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            border-top: 1px solid #2b3040;
            margin-top: 50px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>KavKaz Bot</h1>

    <nav>
        <a href="#status">Status</a>
        <a href="#changelog" id="changelogNav" class="hidden">Change Log</a>
        <a href="#commands">Befehle</a>
        <a href="admin.html">Admin</a>
    </nav>
</header>

<div class="hero">
    <h2>KavKaz Bot</h2>
    <p>Discord Bot Status & Informationen</p>
</div>

<section id="status">
    <div class="card">
        <h2>Bot Status</h2>

        <div id="statusTitle" class="status">
            Wird geladen...
        </div>

        <p id="statusText">
            Bitte warten...
        </p>
    </div>
</section>

<section id="changelog" class="hidden">

    <div class="card">

        <h2>Change Log</h2>

        <h3 id="changelogTitle"></h3>

        <p id="changelogText"></p>

        <small id="changelogDate"></small>

    </div>

</section>

<section id="commands">

    <div class="card">

        <h2>Befehle</h2>

        <div id="commandsList">
            <p>Befehle werden geladen...</p>
        </div>

    </div>

</section>

<footer>
    KavKaz Bot © 2026
</footer>

<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbxah6ugNeCZn1Vy2wt5tmFIGGQhQbFMJk20pSaP_8RGBpyEzp8IwAfVRkFZQBig9FrI/exec";


/* =========================
   JSONP
========================= */

function loadJSONP(action) {

    return new Promise((resolve, reject) => {

        const callbackName =
            "kavkazCallback_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 100000);

        const script =
            document.createElement("script");

        const timeout =
            setTimeout(() => {

                cleanup();

                reject(
                    new Error("Zeitüberschreitung")
                );

            }, 10000);


        function cleanup() {

            clearTimeout(timeout);

            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }

            delete window[callbackName];
        }


        window[callbackName] = function(data) {

            cleanup();

            resolve(data);

        };


        script.onerror = function() {

            cleanup();

            reject(
                new Error("API konnte nicht geladen werden")
            );

        };


        script.src =
            API_URL +
            "?action=" +
            encodeURIComponent(action) +
            "&callback=" +
            encodeURIComponent(callbackName) +
            "&_=" +
            Date.now();


        document.body.appendChild(script);

    });

}


/* =========================
   STATUS
========================= */

async function loadStatus() {

    try {

        const data =
            await loadJSONP("status");


        if (!data || !data.success) {

            throw new Error(
                data?.error || "Status konnte nicht geladen werden."
            );

        }


        const status =
            data.status || "offline";


        const title =
            data.title || "Bot Offline";


        const text =
            data.text ||
            "Der Bot ist derzeit offline.";


        const titleElement =
            document.getElementById("statusTitle");

        const textElement =
            document.getElementById("statusText");


        titleElement.textContent =
            title;

        textElement.textContent =
            text;


        /*
           Statusfarbe bestimmen
        */

        const titleLower =
            title.toLowerCase();


        if (titleLower.includes("online")) {

            titleElement.className =
                "status active";

        } else if (
            titleLower.includes("wartung") ||
            titleLower.includes("entwicklung") ||
            status === "maintenance" ||
            status === "wartung"
        ) {

            titleElement.className =
                "status maintenance";

        } else {

            titleElement.className =
                "status offline";

        }


    } catch (error) {

        console.error(
            "Status Fehler:",
            error
        );

        document.getElementById(
            "statusTitle"
        ).textContent =
            "Bot Offline";


        document.getElementById(
            "statusTitle"
        ).className =
            "status offline";


        document.getElementById(
            "statusText"
        ).textContent =
            "Der Status konnte nicht geladen werden.";

    }

}


/* =========================
   CHANGE LOG
========================= */

async function loadChangelog() {

    try {

        const data =
            await loadJSONP("changelog");


        if (!data || !data.success) {
            return;
        }


        const changelog =
            data.changelog;


        if (
            !changelog ||
            !changelog.text ||
            !changelog.text.trim()
        ) {

            document
                .getElementById("changelog")
                .classList.add("hidden");

            document
                .getElementById("changelogNav")
                .classList.add("hidden");

            return;

        }


        document
            .getElementById("changelog")
            .classList.remove("hidden");


        document
            .getElementById("changelogNav")
            .classList.remove("hidden");


        document
            .getElementById("changelogTitle")
            .textContent =
            changelog.title || "Neue Änderung";


        document
            .getElementById("changelogText")
            .textContent =
            changelog.text;


        document
            .getElementById("changelogDate")
            .textContent =
            changelog.date || "";

    } catch (error) {

        console.error(
            "Change Log Fehler:",
            error
        );

    }

}


/* =========================
   BEFEHLE
========================= */

async function loadCommands() {

    const container =
        document.getElementById("commandsList");


    try {

        const data =
            await loadJSONP("commands");


        console.log(
            "Commands API:",
            data
        );


        if (!data || !data.success) {

            throw new Error(
                data?.error ||
                "Befehle konnten nicht geladen werden."
            );

        }


        const commands =
            Array.isArray(data.commands)
                ? data.commands
                : [];


        container.innerHTML = "";


        if (commands.length === 0) {

            container.innerHTML =
                "<p>Aktuell sind keine Befehle eingetragen.</p>";

            return;

        }


        commands.forEach(command => {

            const card =
                document.createElement("div");

            card.className =
                "command-card";


            const name =
                command.name ||
                command.command ||
                "Unbekannter Befehl";


            const description =
                command.description ||
                "Keine Beschreibung vorhanden.";


            const status =
                command.status ||
                "active";


            let statusText = "Aktiv";
            let badgeClass = "";

            if (
                status === "development" ||
                status === "wartung"
            ) {

                statusText = "Entwicklung";
                badgeClass = "development";

            } else if (status !== "active") {

                statusText = "Inaktiv";
                badgeClass = "inactive";

            }


            card.innerHTML = `

                <div class="command-name">
                    ${escapeHTML(name)}
                </div>

                <div class="command-description">
                    ${escapeHTML(description)}
                </div>

                <span class="badge ${badgeClass}">
                    ${statusText}
                </span>

            `;


            container.appendChild(card);

        });


    } catch (error) {

        console.error(
            "Befehle Fehler:",
            error
        );


        container.innerHTML =
            "<p>Befehle konnten nicht geladen werden.</p>";

    }

}


/* =========================
   HTML SICHERHEIT
========================= */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadStatus();

        loadChangelog();

        loadCommands();

    }
);

</script>

</body>
</html>
