<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KavKaz Bot – Admin</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .admin-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .admin-card {
            background: #11141b;
            border: 1px solid #252a34;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .admin-card h2 {
            margin-bottom: 25px;
        }

        .status-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .status-button {
            border: 1px solid #303641;
            background: #181c24;
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .status-button:hover {
            background: #242a35;
        }

        .status-button.selected {
            border-color: #7d8cff;
            background: #202642;
        }

        label {
            display: block;
            color: #aeb4c0;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            background: #090b10;
            color: white;
            border: 1px solid #303641;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            outline: none;
            margin-bottom: 18px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #7d8cff;
        }

        .admin-button {
            border: 0;
            background: #5865f2;
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .admin-button:hover {
            background: #4752c4;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #8d96ff;
            text-decoration: none;
        }

        .hint {
            color: #8d94a1;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        @media (max-width: 700px) {
            .status-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        KAVKAZ ADMIN
    </div>

    <nav>
        <a href="index.html">
            Website
        </a>
    </nav>

</header>

<main>

    <div class="admin-container">

        <div class="section-title">

            <span>
                ADMIN PANEL
            </span>

            <h2>
                KavKaz Bot Verwaltung
            </h2>

        </div>

        <!-- BOT STATUS -->

        <div class="admin-card">

            <h2>
                Bot Status
            </h2>

            <div class="status-buttons">

                <button
                    class="status-button"
                    data-status="online"
                >
                    🟢 Online
                </button>

                <button
                    class="status-button"
                    data-status="maintenance"
                >
                    🟠 Wartungsarbeiten
                </button>

                <button
                    class="status-button"
                    data-status="offline"
                >
                    🔴 Offline
                </button>

            </div>

            <br>

            <label for="status-message">
                Status-Nachricht
            </label>

            <input
                id="status-message"
                type="text"
                placeholder="z.B. Der Bot läuft problemlos."
            >

            <button
                id="save-status"
                class="admin-button"
            >
                Status speichern
            </button>

            <div
                id="status-result"
                class="message"
            ></div>

        </div>

        <!-- CHANGE LOG -->

        <div class="admin-card">

            <h2>
                Discord Change Log
            </h2>

            <p class="hint">
                Schreibe hier den kompletten Change Log hinein.
                Der Text wird direkt als normale Discord-Nachricht
                in den Change-Log-Kanal gesendet.
            </p>

            <label for="changelog-text">
                Change Log
            </label>

            <textarea
                id="changelog-text"
                placeholder="**Changes:**

- Neuer Punkt

**Fixes:**

- Fehler behoben."
            ></textarea>

            <button
                id="add-changelog"
                class="admin-button"
            >
                📢 Change Log veröffentlichen
            </button>

            <div
                id="changelog-result"
                class="message"
            ></div>

        </div>

        <a
            class="back-link"
            href="index.html"
        >
            ← Zur öffentlichen Website
        </a>

    </div>

</main>

<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbxj4MyQARTi7sUlHtZHX8Wq6cIX19jJlh596LmJiCdBt49EYwhiG4UK1-bdIwR8ZI1s/exec";


let selectedStatus = "offline";


const statusButtons =
    document.querySelectorAll(".status-button");


statusButtons.forEach(button => {

    button.addEventListener("click", () => {

        statusButtons.forEach(btn => {
            btn.classList.remove("selected");
        });

        button.classList.add("selected");

        selectedStatus =
            button.dataset.status;

    });

});


function showMessage(element, text, type) {

    element.textContent = text;

    element.className =
        "message " + type;

}


/* ================================
   STATUS SPEICHERN
================================ */

async function saveStatus() {

    const message =
        document
            .getElementById("status-message")
            .value
            .trim();

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: new URLSearchParams({

                    action: "status",

                    status:
                        selectedStatus,

                    text:
                        message

                })

            });


        const result =
            await response.json();


        if (!response.ok || result.success === false) {

            throw new Error(
                result.error ||
                "Status konnte nicht gespeichert werden."
            );

        }


        showMessage(

            document.getElementById(
                "status-result"
            ),

            "✅ Status wurde erfolgreich gespeichert.",

            "success"

        );


    } catch (error) {

        console.error(error);

        showMessage(

            document.getElementById(
                "status-result"
            ),

            "❌ Fehler: " +
                error.message,

            "error"

        );

    }

}


document
    .getElementById("save-status")
    .addEventListener(
        "click",
        saveStatus
    );


/* ================================
   CHANGE LOG
================================ */

async function addChangelog() {

    const text =
        document
            .getElementById("changelog-text")
            .value
            .trim();


    if (!text) {

        showMessage(

            document.getElementById(
                "changelog-result"
            ),

            "❌ Bitte zuerst einen Change Log eingeben.",

            "error"

        );

        return;

    }


    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body: new URLSearchParams({

                    action: "changelog",

                    text:
                        text

                })

            });


        const result =
            await response.json();


        if (!response.ok || result.success === false) {

            throw new Error(

                result.error ||
                "Change Log konnte nicht gesendet werden."

            );

        }


        showMessage(

            document.getElementById(
                "changelog-result"
            ),

            "✅ Change Log wurde erfolgreich an Discord gesendet.",

            "success"

        );


        document
            .getElementById(
                "changelog-text"
            )
            .value = "";


    } catch (error) {

        console.error(error);

        showMessage(

            document.getElementById(
                "changelog-result"
            ),

            "❌ Fehler: " +
                error.message,

            "error"

        );

    }

}


document
    .getElementById("add-changelog")
    .addEventListener(
        "click",
        addChangelog
    );


/* ================================
   STATUS LADEN
================================ */

async function loadStatus() {

    try {

        const response =
            await fetch(
                API_URL +
                "?action=status"
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        selectedStatus =
            data.status ||
            "offline";


        statusButtons.forEach(button => {

            if (
                button.dataset.status ===
                selectedStatus
            ) {

                button.classList.add(
                    "selected"
                );

            }

        });


        document
            .getElementById(
                "status-message"
            )
            .value =
                data.text ||
                "";


    } catch (error) {

        console.error(
            "Status konnte nicht geladen werden:",
            error
        );

    }

}


loadStatus();

</script>

</body>
</html>
