<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KavKaz Bot – Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #202020 0%, #0d0d0d 45%, #050505 100%);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        .login-box,
        .admin-box {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .login-box {
            width: 100%;
            max-width: 450px;
            margin: 80px auto;
            padding: 35px;
        }

        .admin-box {
            padding: 25px;
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 18px;
        }

        .section {
            margin-bottom: 25px;
            padding: 22px;
            background: #111;
            border: 1px solid #2c2c2c;
            border-radius: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1b1b1b;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #777;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            background: #ffffff;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        button.danger {
            background: #d93030;
            color: white;
        }

        button.secondary {
            background: #333;
            color: white;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .status-message {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #181818;
            border: 1px solid #333;
            min-height: 20px;
        }

        .command-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .command-item {
            background: #181818;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
        }

        .command-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .command-name {
            font-size: 18px;
            font-weight: bold;
        }

        .command-description {
            color: #bbb;
            margin-top: 7px;
        }

        .command-status {
            margin-top: 10px;
            font-size: 14px;
        }

        .command-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .hidden {
            display: none !important;
        }

        .small {
            color: #999;
            font-size: 13px;
        }

        .success {
            color: #63e66d;
        }

        .error {
            color: #ff5c5c;
        }

        .warning {
            color: #ffb347;
        }

        @media (max-width: 700px) {

            .container {
                padding: 15px 10px 40px;
            }

            .admin-box {
                padding: 15px;
            }

            .section {
                padding: 16px;
            }

            .login-box {
                margin: 30px auto;
                padding: 25px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- LOGIN -->

    <div
        id="loginBox"
        class="login-box"
    >

        <h1>KavKaz Bot</h1>

        <h2>Admin Login</h2>

        <label for="username">
            Benutzername
        </label>

        <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="Benutzername"
        >

        <label for="password">
            Passwort
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Passwort"
        >

        <button
            onclick="login()"
            style="width:100%;"
        >
            Einloggen
        </button>

        <div
            id="loginMessage"
            class="status-message"
        ></div>

    </div>


    <!-- ADMIN -->

    <div
        id="adminPanel"
        class="admin-box hidden"
    >

        <div class="topbar">

            <div>

                <h1 style="text-align:left; margin-bottom:5px;">
                    KavKaz Bot – Admin
                </h1>

                <div class="small">
                    Admin-Bereich
                </div>

            </div>

            <button
                class="secondary"
                onclick="logout()"
            >
                Abmelden
            </button>

        </div>


        <!-- BOT STATUS -->

        <div class="section">

            <h2>Bot Status</h2>

            <label for="botStatus">
                Status
            </label>

            <select id="botStatus">

                <option value="active">
                    🟢 Bot Online
                </option>

                <option value="maintenance">
                    🟠 Wartungsarbeiten
                </option>

                <option value="offline">
                    🔴 Bot Offline
                </option>

            </select>


            <label for="botTitle">
                Titel
            </label>

            <input
                id="botTitle"
                type="text"
                placeholder="Bot Online"
            >


            <label for="botText">
                Beschreibung
            </label>

            <textarea
                id="botText"
                placeholder="Der Bot ist derzeit online."
            ></textarea>


            <button onclick="saveStatus()">
                Status speichern
            </button>

            <div
                id="statusMessage"
                class="status-message"
            ></div>

        </div>


        <!-- CHANGELOG -->

        <div class="section">

            <h2>Change Log</h2>

            <label for="changelogText">
                Neuer Change Log
            </label>

            <textarea
                id="changelogText"
                placeholder="Beschreibe hier die Änderungen..."
            ></textarea>

            <button onclick="addChangelog()">
                Change Log veröffentlichen
            </button>

            <div
                id="changelogMessage"
                class="status-message"
            ></div>

        </div>


        <!-- COMMANDS -->

        <div class="section">

            <h2>Befehle</h2>

            <div
                id="commandsList"
                class="command-list"
            >

                <div class="small">
                    Befehle werden geladen...
                </div>

            </div>

        </div>


        <!-- ADD COMMAND -->

        <div class="section">

            <h2>Befehl hinzufügen</h2>

            <label for="commandName">
                Befehl
            </label>

            <input
                id="commandName"
                type="text"
                placeholder="/beispiel"
            >

            <label for="commandDescription">
                Beschreibung
            </label>

            <input
                id="commandDescription"
                type="text"
                placeholder="Beschreibung des Befehls"
            >

            <label for="commandStatus">
                Status
            </label>

            <select id="commandStatus">

                <option value="active">
                    🟢 Aktiv
                </option>

                <option value="development">
                    🟠 Entwicklung
                </option>

                <option value="disabled">
                    🔴 Deaktiviert
                </option>

            </select>

            <button onclick="saveCommand()">
                Befehl speichern
            </button>

            <div
                id="commandMessage"
                class="status-message"
            ></div>

        </div>

    </div>

</div>


<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbxj4MyQARTi7sUlHtZHX8Wq6cIX19jJlh596LmJiCdBt49EYwhiG4UK1-bdIwR8ZI1s/exec";


let SESSION = localStorage.getItem("kavkaz_admin_session") || "";



/* =========================================================
   JSONP API
   ========================================================= */

function apiGet(params) {

    return new Promise((resolve, reject) => {

        const callbackName =
            "kavkazApi_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 100000);


        const script =
            document.createElement("script");


        let finished = false;


        function cleanup() {

            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }

            try {
                delete window[callbackName];
            } catch (e) {
                window[callbackName] = undefined;
            }

        }


        window[callbackName] = function(result) {

            if (finished) {
                return;
            }

            finished = true;

            cleanup();

            resolve(result);

        };


        script.onerror = function() {

            if (finished) {
                return;
            }

            finished = true;

            cleanup();

            reject(
                new Error(
                    "Verbindung zum Server fehlgeschlagen."
                )
            );

        };


        const query =
            new URLSearchParams();


        Object.keys(params).forEach(function(key) {

            const value = params[key];

            if (
                value !== undefined &&
                value !== null
            ) {

                query.append(
                    key,
                    value
                );

            }

        });


        query.append(
            "callback",
            callbackName
        );


        script.src =
            API_URL +
            "?" +
            query.toString();


        document.body.appendChild(script);


        setTimeout(function() {

            if (finished) {
                return;
            }

            finished = true;

            cleanup();

            reject(
                new Error(
                    "Zeitüberschreitung beim Server."
                )
            );

        }, 20000);

    });

}



/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    const message =
        document.getElementById("loginMessage");


    if (!username || !password) {

        message.innerHTML =
            '<span class="error">Bitte Benutzername und Passwort eingeben.</span>';

        return;

    }


    message.innerHTML =
        "Login wird geprüft...";


    try {

        const data =
            await apiGet({

                action: "login",

                username: username,

                password: password

            });


        if (
            data &&
            data.success
        ) {

            SESSION =
                data.session;


            localStorage.setItem(
                "kavkaz_admin_session",
                SESSION
            );


            message.innerHTML =
                '<span class="success">Login erfolgreich.</span>';


            document.getElementById(
                "loginBox"
            ).classList.add("hidden");


            document.getElementById(
                "adminPanel"
            ).classList.remove("hidden");


            document.getElementById(
                "password"
            ).value = "";


            await loadStatus();

            await loadCommands();

        } else {

            message.innerHTML =
                '<span class="error">' +
                (
                    data &&
                    data.message
                        ? data.message
                        : "Login fehlgeschlagen."
                ) +
                '</span>';

        }

    } catch (error) {

        console.error(error);

        message.innerHTML =
            '<span class="error">' +
            error.message +
            '</span>';

    }

}



/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

    SESSION = "";

    localStorage.removeItem(
        "kavkaz_admin_session"
    );


    document.getElementById(
        "adminPanel"
    ).classList.add("hidden");


    document.getElementById(
        "loginBox"
    ).classList.remove("hidden");


    document.getElementById(
        "username"
    ).value = "";


    document.getElementById(
        "password"
    ).value = "";

}



/* =========================================================
   SESSION PRÜFEN
   ========================================================= */

function checkSession() {

    if (!SESSION) {
        return false;
    }

    document.getElementById(
        "loginBox"
    ).classList.add("hidden");


    document.getElementById(
        "adminPanel"
    ).classList.remove("hidden");


    return true;

}



/* =========================================================
   STATUS LADEN
   ========================================================= */

async function loadStatus() {

    if (!SESSION) {
        return;
    }


    try {

        const data =
            await apiGet({

                action: "status"

            });


        if (
            !data ||
            !data.success
        ) {

            return;

        }


        const status =
            data.status || "offline";


        document.getElementById(
            "botStatus"
        ).value = status;


        document.getElementById(
            "botTitle"
        ).value =
            data.title || "";


        document.getElementById(
            "botText"
        ).value =
            data.text || "";

    } catch (error) {

        console.error(
            "Status konnte nicht geladen werden:",
            error
        );

    }

}



/* =========================================================
   STATUS SPEICHERN
   ========================================================= */

async function saveStatus() {

    const message =
        document.getElementById(
            "statusMessage"
        );


    if (!SESSION) {

        message.innerHTML =
            '<span class="error">Keine gültige Sitzung.</span>';

        return;

    }


    const status =
        document.getElementById(
            "botStatus"
        ).value;


    const title =
        document.getElementById(
            "botTitle"
        ).value;


    const botText =
        document.getElementById(
            "botText"
        ).value;


    message.innerHTML =
        "Status wird gespeichert...";


    try {

        const data =
            await apiGet({

                action: "saveStatus",

                session: SESSION,

                status: status,

                title: title,

                text: botText

            });


        if (
            data &&
            data.success
        ) {

            message.innerHTML =
                '<span class="success">✅ Status erfolgreich gespeichert.</span>';

        } else {

            message.innerHTML =
                '<span class="error">❌ ' +
                (
                    data &&
                    data.message
                        ? data.message
                        : "Status konnte nicht gespeichert werden."
                ) +
                '</span>';

            if (
                data &&
                data.message === "Nicht autorisiert"
            ) {
                logout();
            }

        }

    } catch (error) {

        console.error(error);

        message.innerHTML =
            '<span class="error">❌ Fehler: ' +
            error.message +
            '</span>';

    }

}



/* =========================================================
   COMMANDS LADEN
   ========================================================= */

async function loadCommands() {

    const list =
        document.getElementById(
            "commandsList"
        );


    list.innerHTML =
        '<div class="small">Befehle werden geladen...</div>';


    try {

        const data =
            await apiGet({

                action: "commands"

            });


        if (
            !data ||
            !data.success
        ) {

            list.innerHTML =
                '<div class="error">❌ Befehle konnten nicht geladen werden.</div>';

            return;

        }


        const commands =
            Array.isArray(data.commands)
                ? data.commands
                : [];


        if (commands.length === 0) {

            list.innerHTML =
                '<div class="small">Noch keine Befehle vorhanden.</div>';

            return;

        }


        list.innerHTML = "";


        commands.forEach(function(command) {

            const item =
                document.createElement("div");


            item.className =
                "command-item";


            let statusText =
                "🔴 Deaktiviert";


            if (
                command.status === "active"
            ) {

                statusText =
                    "🟢 Aktiv";

            } else if (
                command.status === "development" ||
                command.status === "maintenance"
            ) {

                statusText =
                    "🟠 Entwicklung";

            }


            item.innerHTML = `

                <div class="command-header">

                    <div>

                        <div class="command-name">
                            ${escapeHtml(command.name || command.command || "")}
                        </div>

                        <div class="command-description">
                            ${escapeHtml(command.description || "")}
                        </div>

                    </div>

                </div>

                <div class="command-status">
                    Status: ${statusText}
                </div>

                <div class="command-actions">

                    <button
                        class="secondary"
                        onclick="editCommand('${escapeJs(command.id)}')"
                    >
                        Bearbeiten
                    </button>

                    <button
                        class="danger"
                        onclick="deleteCommand('${escapeJs(command.id)}')"
                    >
                        Löschen
                    </button>

                </div>

            `;


            list.appendChild(item);

        });


        window.kavkazCommands =
            commands;

    } catch (error) {

        console.error(error);

        list.innerHTML =
            '<div class="error">❌ Befehle konnten nicht geladen werden.</div>';

    }

}



/* =========================================================
   BEFEHL SPEICHERN
   ========================================================= */

async function saveCommand() {

    const message =
        document.getElementById(
            "commandMessage"
        );


    if (!SESSION) {

        message.innerHTML =
            '<span class="error">Keine gültige Sitzung.</span>';

        return;

    }


    const name =
        document.getElementById(
            "commandName"
        ).value.trim();


    const description =
        document.getElementById(
            "commandDescription"
        ).value.trim();


    let status =
        document.getElementById(
            "commandStatus"
        ).value;


    if (!name) {

        message.innerHTML =
            '<span class="error">Bitte einen Befehl eingeben.</span>';

        return;

    }


    if (!description) {

        message.innerHTML =
            '<span class="error">Bitte eine Beschreibung eingeben.</span>';

        return;

    }


    if (status === "maintenance") {
        status = "development";
    }


    message.innerHTML =
        "Befehl wird gespeichert...";


    try {

        const data =
            await apiGet({

                action: "saveCommand",

                session: SESSION,

                name: name,

                description: description,

                status: status

            });


        if (
            data &&
            data.success
        ) {

            message.innerHTML =
                '<span class="success">✅ Befehl erfolgreich gespeichert.</span>';


            document.getElementById(
                "commandName"
            ).value = "";


            document.getElementById(
                "commandDescription"
            ).value = "";


            document.getElementById(
                "commandStatus"
            ).value = "active";


            await loadCommands();

        } else {

            message.innerHTML =
                '<span class="error">❌ ' +
                (
                    data &&
                    data.message
                        ? data.message
                        : "Befehl konnte nicht gespeichert werden."
                ) +
                '</span>';


            if (
                data &&
                data.message === "Nicht autorisiert"
            ) {

                logout();

            }

        }

    } catch (error) {

        console.error(error);

        message.innerHTML =
            '<span class="error">❌ Fehler: ' +
            error.message +
            '</span>';

    }

}



/* =========================================================
   BEFEHL BEARBEITEN
   ========================================================= */

function editCommand(id) {

    const commands =
        window.kavkazCommands || [];


    const command =
        commands.find(function(item) {

            return String(item.id) === String(id);

        });


    if (!command) {

        alert(
            "Befehl konnte nicht gefunden werden."
        );

        return;

    }


    document.getElementById(
        "commandName"
    ).value =
        command.name ||
        command.command ||
        "";


    document.getElementById(
        "commandDescription"
    ).value =
        command.description ||
        "";


    let status =
        command.status || "active";


    if (status === "maintenance") {
        status = "development";
    }


    document.getElementById(
        "commandStatus"
    ).value =
        status;


    window.editingCommandId =
        command.id;


    const button =
        document.querySelector(
            'button[onclick="saveCommand()"]'
        );


    if (button) {

        button.textContent =
            "Befehl aktualisieren";

    }

}



/* =========================================================
   BEFEHL LÖSCHEN
   ========================================================= */

async function deleteCommand(id) {

    if (
        !confirm(
            "Möchtest du diesen Befehl wirklich löschen?"
        )
    ) {

        return;

    }


    try {

        const data =
            await apiGet({

                action: "deleteCommand",

                session: SESSION,

                id: id

            });


        if (
            data &&
            data.success
        ) {

            await loadCommands();

        } else {

            alert(
                data &&
                data.message
                    ? data.message
                    : "Befehl konnte nicht gelöscht werden."
            );

        }

    } catch (error) {

        console.error(error);

        alert(
            "Fehler: " +
            error.message
        );

    }

}



/* =========================================================
   CHANGELOG
   ========================================================= */

async function addChangelog() {

    const message =
        document.getElementById(
            "changelogMessage"
        );


    if (!SESSION) {

        message.innerHTML =
            '<span class="error">Keine gültige Sitzung.</span>';

        return;

    }


    const text =
        document.getElementById(
            "changelogText"
        ).value.trim();


    if (!text) {

        message.innerHTML =
            '<span class="error">Bitte einen Change Log eingeben.</span>';

        return;

    }


    message.innerHTML =
        "Change Log wird veröffentlicht...";


    try {

        const data =
            await apiGet({

                action: "saveChangelog",

                session: SESSION,

                text: text

            });


        if (
            data &&
            data.success
        ) {

            message.innerHTML =
                '<span class="success">✅ Change Log erfolgreich veröffentlicht.</span>';


            document.getElementById(
                "changelogText"
            ).value = "";

        } else {

            message.innerHTML =
                '<span class="error">❌ ' +
                (
                    data &&
                    data.message
                        ? data.message
                        : "Change Log konnte nicht gespeichert werden."
                ) +
                '</span>';


            if (
                data &&
                data.message === "Nicht autorisiert"
            ) {

                logout();

            }

        }

    } catch (error) {

        console.error(error);

        message.innerHTML =
            '<span class="error">❌ Fehler: ' +
            error.message +
            '</span>';

    }

}



/* =========================================================
   HTML SICHER AUSGEBEN
   ========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeJs(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}



/* =========================================================
   ENTER = LOGIN
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !document
                .getElementById("loginBox")
                .classList.contains("hidden")
        ) {

            login();

        }

    }
);



/* =========================================================
   AUTOMATISCH EINLOGGEN / SESSION
   ========================================================= */

if (SESSION) {

    checkSession();

    loadStatus();

    loadCommands();

}

</script>

</body>

</html>
